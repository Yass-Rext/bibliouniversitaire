<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Le filtre |default permet d'afficher un titre par défaut si la page n'en définit pas -->
    <title>{% block title %}BiblioUniv - Catalogue{% endblock %}</title>
    
    <!-- Utilisation de Bootstrap 5 via CDN pour avoir un design propre sans configuration -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Barre de Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">📚 BiblioUniv</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'liste_livres' %}">Catalogue</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/" target="_blank">Espace Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteneur Principal (Où s'insère le contenu des pages enfants) -->
    <main class="container flex-grow-1">
        {% block content %}
        <!-- Le contenu spécifique de chaque page sera injecté ici -->
        {% endblock %}
    </main>

    <!-- Pied de Page -->
    <footer class="bg-white text-center text-muted py-3 mt-5 border-top">
        <div class="container">
            <p class="mb-0">&copy; 2026 BiblioUniv - Gestion du Catalogue Universitaire</p>
        </div>
    </footer>

    <!-- Bootstrap JS (pour le menu mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
